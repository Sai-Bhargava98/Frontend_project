<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Movie Ticker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #000;
    color: #fff;
  }
  .ticker-container {
    overflow: hidden;
    white-space: nowrap;
    background-color: #222;
    padding: 10px 0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }
  .ticker {
    display: inline-block;
    padding-left: 100%;
    animation: scroll-left 20s linear infinite;
    font-size: 1.2em;
  }
  @keyframes scroll-left {
    0% {
      transform: translateX(0%);
    }
    100% {
      transform: translateX(-100%);
    }
  }
  .movie {
    display: inline-block;
    margin: 0 50px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="ticker-container">
  <div class="ticker">
    <div class="movie">The Batman &nbsp;|&nbsp; Top Gun: Maverick &nbsp;|&nbsp; Doctor Strange &nbsp;|&nbsp; Avatar: The Way of Water &nbsp;|&nbsp; Jurassic World Dominion &nbsp;|&nbsp; Thor: Love and Thunder &nbsp;|&nbsp; Black Panther: Wakanda Forever</div>
  </div>
</div>
</body>
</html>
